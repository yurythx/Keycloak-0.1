networks:
  frontend:
    name: keycloak_frontend
    driver: bridge
  backend:
    name: keycloak_backend
    driver: bridge
    internal: true # Isola o banco de dados completamente, sem rota de saida para a internet
  vw_frontend:
    name: vaultwarden_frontend
    driver: bridge
  vw_backend:
    name: vaultwarden_backend
    driver: bridge
    internal: true # Isola o banco do Vaultwarden - so o app (vw_frontend+vw_backend) fala com ele

volumes:
  postgres_data:
    driver: local
  portainer_data:
    driver: local
  vw_db_data:
    driver: local
  vw_app_data:
    driver: local

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  kc_admin_password:
    file: ./secrets/kc_admin_password.txt
  vw_postgres_password:
    file: ./secrets/vw_postgres_password.txt
  vw_admin_token:
    file: ./secrets/vw_admin_token.txt
  vw_sso_client_secret:
    file: ./secrets/vw_sso_client_secret.txt

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Banco de Dados PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: keycloak_db
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak_user}
      # Imagem oficial do Postgres suporta _FILE nativamente (diferente do Keycloak)
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tuning de performance do PostgreSQL para carga institucional
    # (assume VM com min. 8 vCPU / 16GB RAM - ver docs/00-pre-requisitos.md)
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-keycloak_user} -d $${POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    # Sem "ports:" - Postgres so e alcancavel dentro da rede "backend" (internal: true)

  # ---------------------------------------------------------------------------
  # Servidor Keycloak (Build Customizado & Otimizado)
  # ---------------------------------------------------------------------------
  keycloak:
    # Imagem publicada pelo pipeline de CI (.github/workflows/ci.yml) no
    # GitHub Container Registry - "docker compose pull" usa esta imagem.
    # O bloco "build" abaixo continua existindo como fallback: "docker
    # compose build" / "deploy.sh --build" builda localmente com a MESMA
    # tag, para homologacao/dev sem depender do registry.
    image: ${KEYCLOAK_IMAGE:-ghcr.io/yurythx/keycloak-sso}:${KEYCLOAK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keycloak_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    environment:
      # Conexao com o Banco de Dados
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak_user}
      # Resolvido em senha real pelo docker-entrypoint-secrets.sh (ver Dockerfile)
      KC_DB_PASSWORD_FILE: /run/secrets/postgres_password

      # Admin Bootstrap (criado apenas na primeira inicializacao do realm master)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kc_admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password

      # Configuracao de Dominio, HTTP e Proxy
      KC_HOSTNAME: ${KC_HOSTNAME} # Ex: https://sso.rondonopolis.mt.gov.br
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # IP (ou faixa /CIDR) do proxy reverso da prefeitura - so' headers
      # X-Forwarded-* vindos deste endereco sao aceitos. Sem isso apontando
      # pro proxy real, o Keycloak ignora o X-Forwarded-Proto e gera link
      # http:// em vez de https:// nos fluxos OIDC (achado real - ver
      # docs/scripts-referencia.md#proxy-reverso-externo).
      KC_PROXY_TRUSTED_ADDRESSES: ${PROXY_TRUSTED_ADDRESSES}

      # Certificados de Confianca (CA do Active Directory / LDAPS)
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs

      # Management interface (health/metrics) - fica em porta separada (9000),
      # NUNCA publicada no host nem exposta ao proxy externo.
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Tuning de Conexoes e Memoria da JVM
      KC_DB_POOL_INITIAL_SIZE: 20
      KC_DB_POOL_MAX_SIZE: 100
      JAVA_OPTS_APPEND: "-Xms2048m -Xmx4096m -XX:+UseG1GC"
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
    secrets:
      - postgres_password
      - kc_admin_password
    volumes:
      - ./certs:/opt/keycloak/certs:ro
      # Tema visual customizado (logo/cores da prefeitura) - ver
      # docs/tema-visual.md. "themes/" no container so tem um README por
      # padrao (temas nativos ficam empacotados em jars), entao montar
      # aqui nao esconde/substitui o keycloak.v2 nem nenhum tema nativo.
      - ./themes:/opt/keycloak/themes:ro
    # Injecao de FQDN/IP do Domain Controller do Active Directory
    extra_hosts:
      - "${AD_DC_HOSTNAME}:${AD_DC_IP}"
    # Porta exposta direto no host (sem proxy interno na stack) - o proxy
    # reverso/balanceador da prefeitura, que fica em outra maquina, termina
    # o TLS e encaminha pra essa porta em HTTP puro. KEYCLOAK_BIND deve
    # ficar restrito por firewall (iptables/ufw) so' ao IP daquele proxy -
    # nunca deixar essa porta aberta pra internet.
    ports:
      - "${KEYCLOAK_BIND:-0.0.0.0}:${KEYCLOAK_PORT:-18443}:8080"
    healthcheck:
      # bash explicito (nao depende de /bin/sh ser bash) contra a management port 9000,
      # acessada apenas internamente pelo Docker healthcheck - nunca exposta ao host.
      test:
        - "CMD-SHELL"
        - >
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          cat <&3 | grep -q "200 OK"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 4g
    cpus: 2.0
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Vaultwarden (cofre de senhas - servidor compativel com clientes Bitwarden)
  # ---------------------------------------------------------------------------
  # Stack separada da SSO do Keycloak (banco, rede e secret proprios) - so
  # compartilha o padrao de operacao deste repositorio (secrets fora do
  # .env, isolamento de rede, healthcheck, deploy.sh). Publica direto num
  # IP:porta do host (VAULTWARDEN_BIND) pro mesmo proxy reverso externo da
  # prefeitura (192.168.0.218) encaminhar - igual o Keycloak, restrinja
  # essa porta por firewall so' ao IP daquele proxy.
  vaultwarden-db:
    image: postgres:${VW_POSTGRES_VERSION:-16-alpine}
    container_name: vaultwarden_db
    restart: unless-stopped
    networks:
      - vw_backend
    environment:
      POSTGRES_DB: ${VW_POSTGRES_DB:-vaultwarden}
      POSTGRES_USER: ${VW_POSTGRES_USER:-vw_user}
      # Imagem oficial do Postgres suporta _FILE nativamente (mesmo padrao
      # do "postgres" do Keycloak acima)
      POSTGRES_PASSWORD_FILE: /run/secrets/vw_postgres_password
    secrets:
      - vw_postgres_password
    volumes:
      - vw_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${VW_POSTGRES_USER:-vw_user} -d $${VW_POSTGRES_DB:-vaultwarden}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    # Sem "ports:" - so alcancavel dentro da rede "vw_backend" (internal: true)

  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-latest}
    container_name: vaultwarden
    restart: unless-stopped
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    networks:
      - vw_frontend
      - vw_backend
    environment:
      # DATABASE_URL completa (com senha) e' montada em runtime pelo script
      # abaixo, a partir do secret - essas duas so' alimentam esse script,
      # nao expoe a senha em texto plano no .env (ver volumes: abaixo)
      VW_POSTGRES_USER: ${VW_POSTGRES_USER:-vw_user}
      VW_POSTGRES_DB: ${VW_POSTGRES_DB:-vaultwarden}
      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_ADDRESS: 0.0.0.0
      WEBSOCKET_PORT: 3012
      # So' confia no X-Forwarded-For se a porta publicada abaixo estiver
      # mesmo restrita por firewall ao IP do proxy da prefeitura - o
      # Vaultwarden, diferente do Keycloak (PROXY_TRUSTED_ADDRESSES), nao
      # valida de qual IP o header veio, so' confia cegamente se
      # IP_HEADER estiver setado.
      IP_HEADER: X-Forwarded-For
      # Autorregistro DESLIGADO de proposito - achado de revisao de
      # seguranca: sem isso, qualquer pessoa que alcance a URL publica
      # cria conta propria neste cofre da prefeitura sem aprovacao (o
      # padrao do Vaultwarden e' SIGNUPS_ALLOWED=true). Contas novas
      # sao criadas pelo admin via /admin (ADMIN_TOKEN abaixo) e
      # convidadas por ali - nao precisa de SMTP/e-mail configurado, o
      # link de convite/reset aparece no log do container
      # ("docker compose logs vaultwarden") pro admin repassar manualmente.
      SIGNUPS_ALLOWED: "false"
      # Habilita o painel /admin (criar/gerenciar usuarios sem autorregistro
      # e sem SMTP) - token lido do secret abaixo, nunca em texto plano no .env.
      ADMIN_TOKEN_FILE: /run/secrets/vw_admin_token
      # URL publica deste Vaultwarden - OBRIGATORIA (achado real: com a
      # variavel vazia o Vaultwarden nao apenas ignora, ele RECUSA subir -
      # "DOMAIN variable needs to contain the protocol". Mesmo papel do
      # KC_HOSTNAME do Keycloak, e mesmo tratamento de obrigatoriedade
      # (deploy.sh/setup.sh verificam, ver PROXY_TRUSTED_ADDRESSES).
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      # Login via SSO (OpenID Connect) contra o MESMO Keycloak desta stack -
      # desligado por padrao (nao quebra quem ainda nao configurou um
      # client no Keycloak para isso). Ver docs/06-vaultwarden.md#sso.
      # SSO_AUTHORITY precisa ser a URL PUBLICA do realm (a mesma que o
      # navegador do usuario acessa) - nao um atalho de rede interna: o
      # navegador precisa alcancar o endpoint de autorizacao, e o proprio
      # Vaultwarden (backend) faz a troca do code por token contra essa
      # mesma URL depois.
      SSO_ENABLED: ${VAULTWARDEN_SSO_ENABLED:-false}
      SSO_AUTHORITY: ${VAULTWARDEN_SSO_AUTHORITY:-}
      SSO_CLIENT_ID: ${VAULTWARDEN_SSO_CLIENT_ID:-vaultwarden}
      SSO_CLIENT_SECRET_FILE: /run/secrets/vw_sso_client_secret
      SSO_SCOPES: "openid email profile"
      SSO_PKCE: "true"
    secrets:
      - vw_postgres_password
      - vw_admin_token
      - vw_sso_client_secret
    volumes:
      - vw_app_data:/data
      # O entrypoint padrao da imagem (/start.sh) executa qualquer *.sh
      # dentro de /etc/vaultwarden.d/ antes de rodar o binario - usamos
      # isso pra montar o DATABASE_URL com a senha lida do secret em
      # runtime, sem nunca escrever a senha em texto plano no .env (mesmo
      # cuidado do KC_DB_PASSWORD_FILE do Keycloak, adaptado pro
      # Vaultwarden nao ter um "_FILE" nativo pra DATABASE_URL).
      - ./scripts/vaultwarden-database-url.sh:/etc/vaultwarden.d/00-database-url.sh:ro
    ports:
      - "${VAULTWARDEN_BIND:-192.168.0.225}:${VAULTWARDEN_HTTP_PORT:-8081}:80"
      - "${VAULTWARDEN_BIND:-192.168.0.225}:${VAULTWARDEN_WS_PORT:-3012}:3012"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.5

  # ---------------------------------------------------------------------------
  # Portainer (opcional - gerenciador visual do Docker)
  # ---------------------------------------------------------------------------
  # So sobe com o profile "portainer" ativo (deploy.sh le ENABLE_PORTAINER
  # do .env e ativa/desativa automaticamente - ver docs/scripts-referencia.md).
  #
  # ATENCAO: o Portainer precisa de acesso de LEITURA E ESCRITA ao socket
  # do Docker do host para funcionar - isso equivale a acesso root na VM
  # (quem controla o Docker controla tudo, inclusive o container do
  # Postgres). Por isso o bind padrao e' 127.0.0.1 (so acessivel via SSH
  # tunnel/VPN), nunca exposto direto na internet por padrao.
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    profiles: ["portainer"]
    networks:
      - frontend
    ports:
      - "${PORTAINER_BIND:-127.0.0.1}:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    # Sem healthcheck: a imagem oficial do Portainer e' baseada em "scratch"
    # (sem shell, sem wget/curl) - nao ha nada executavel para um CMD/
    # CMD-SHELL rodar dentro do container. deploy.sh trata a ausencia de
    # healthcheck como "container rodando" (ver scripts/deploy.sh, wait_healthy).
    logging: *default-logging
