# Tema customizado da Prefeitura - herda do tema padrao do Keycloak 26+
# (keycloak.v2, baseado em PatternFly 5). NAO herdar de "keycloak" (tema
# legado, Bootstrap) - nao e' mais o padrao desde o Keycloak 22 e usa
# outra estrutura de classes CSS (.btn-primary etc. nao se aplicam aqui).
#
# "styles" e' cumulativo: o CSS do keycloak.v2 continua sendo carregado
# primeiro, e o nosso styles.css entra DEPOIS - por isso conseguimos so'
# sobrescrever variaveis/regras pontuais em vez de reescrever a pagina
# inteira.
parent=keycloak.v2
styles=css/styles.css
