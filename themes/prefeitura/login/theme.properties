# Tema customizado da Prefeitura - herda do tema padrao do Keycloak 26+
# (keycloak.v2, baseado em PatternFly 5). NAO herdar de "keycloak" (tema
# legado, Bootstrap) - nao e' mais o padrao desde o Keycloak 22 e usa
# outra estrutura de classes CSS (.btn-primary etc. nao se aplicam aqui).
#
# "styles" e' cumulativo: o CSS do keycloak.v2 continua sendo carregado
# primeiro, e o nosso styles.css entra DEPOIS - por isso conseguimos so'
# sobrescrever variaveis/regras pontuais em vez de reescrever a pagina
# inteira.
parent=keycloak.v2
styles=css/styles.css

# "locales" restringe os idiomas disponiveis neste tema a so' portugues -
# sem isso o tema herda a lista completa de locales do keycloak.v2 (en,
# es, de, etc.) e, se o realm tiver "Internationalization" ligado, aparece
# um seletor de idioma na tela de login. Com um unico locale declarado, o
# Keycloak esconde o seletor automaticamente (nao ha o que escolher).
#
# ATENCAO: isso sozinho NAO garante que a tela apareca em portugues - se o
# realm nao tiver "Internationalization" habilitado (Realm Settings ->
# Localization), o Keycloak ignora o tema por completo nesse quesito e usa
# sempre o locale padrao interno (ingles). Ver docs/tema-visual.md, secao
# "Idioma", para o passo que falta configurar no realm.
locales=pt_BR
