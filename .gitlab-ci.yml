# CI/CD para GitLab - espelha .github/workflows/ci.yml (GitHub Actions).
# Mesmos 3 objetivos: lint, build + scan (Trivy), publicar a imagem do
# Keycloak no registry - aqui no GitLab Container Registry nativo do
# projeto ($CI_REGISTRY_IMAGE, sem nenhum secret manual: $CI_REGISTRY_USER
# / $CI_REGISTRY_PASSWORD sao providos automaticamente pelo GitLab).
#
# Pre-requisito: o runner que executa o job "build-scan-push" precisa
# suportar Docker-in-Docker em modo privileged (Admin > CI/CD > Runners,
# ou no config.toml do runner: privileged = true dentro de [runners.docker]).
# Sem isso o job falha ao conversar com o servico "docker:27-dind".
#
# Os dois pipelines (GitHub Actions e este) convivem sem conflito - cada
# plataforma so' processa o arquivo que reconhece.

stages:
  - lint
  - build

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # So' tags de versao (vX.Y.Z), espelhando "tags: ['v*.*.*']" do
    # .github/workflows/ci.yml - sem isso, QUALQUER tag (ex.: uma tag de
    # backup ou marcador interno sem relacao com release) dispararia um
    # build+push completo pro registry, coisa que o GitHub Actions nao faz.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: docker:27-cli
  before_script:
    - apk add --no-cache shellcheck curl
  script:
    # Glob em vez de lista manual - um script novo nunca fica de fora
    # silenciosamente. -S warning: nao trava em achados "info"/"style".
    - shellcheck -S warning *.sh scripts/*.sh scripts/lib/*.sh
    - curl -sSL -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
    - chmod +x /usr/local/bin/hadolint
    - hadolint Dockerfile
    # docker compose config nao precisa de daemon rodando - so' valida/interpola
    - >
      export POSTGRES_DB=keycloak POSTGRES_USER=keycloak_user
      KC_BOOTSTRAP_ADMIN_USERNAME=kc_admin KC_HOSTNAME=https://auth.example.gov.br
      PROXY_TRUSTED_ADDRESSES=172.16.0.0/12 AD_DOMAIN=example.local
      AD_DC_HOSTNAME=dc01.example.local AD_DC_IP=192.0.2.10 KC_LOG_LEVEL=INFO
      KEYCLOAK_IMAGE="${IMAGE_NAME}" KEYCLOAK_IMAGE_TAG=ci
      KEYCLOAK_BIND=0.0.0.0 KEYCLOAK_PORT=18443
    - docker compose -f docker-compose.yml config --quiet

# ---------------------------------------------------------------------------
build-scan-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - apk add --no-cache curl
  script:
    - SHA_TAG="sha-${CI_COMMIT_SHORT_SHA}"
    - docker build -t "${IMAGE_NAME}:${SHA_TAG}" -f Dockerfile .
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    # Relatorio informativo (nao bloqueia) + gate que so' bloqueia em CRITICAL.
    # HIGH em dependencias de terceiros empacotadas pelo proprio Keycloak
    # (jackson, netty, drivers JDBC nao usados por nos) e quase impossivel
    # zerar a cada release do vendor - decisao registrada em docs/ci-cd.md.
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed "${IMAGE_NAME}:${SHA_TAG}"
    - trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE_NAME}:${SHA_TAG}"
    # So' publica em pipeline real (branch default ou tag) - nunca em MR
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag "${IMAGE_NAME}:${SHA_TAG}" "${IMAGE_NAME}:latest"
        docker push "${IMAGE_NAME}:${SHA_TAG}"
        docker push "${IMAGE_NAME}:latest"
        if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag "${IMAGE_NAME}:${SHA_TAG}" "${IMAGE_NAME}:${CI_COMMIT_TAG}"
          docker push "${IMAGE_NAME}:${CI_COMMIT_TAG}"
        fi
        echo "Imagem publicada: ${IMAGE_NAME}:${SHA_TAG}"
        echo "Para travar producao nesta versao, no .env da VM: KEYCLOAK_IMAGE=${IMAGE_NAME} e KEYCLOAK_IMAGE_TAG=${SHA_TAG}"
      else
        echo "Pipeline de Merge Request: build e scan OK, sem publicar no registry"
      fi
