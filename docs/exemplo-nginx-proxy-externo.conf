# =============================================================================
# Exemplo de vhost Nginx para o PROXY REVERSO EXTERNO da prefeitura.
#
# Este arquivo NAO roda nesta stack - a stack (docker-compose.yml) so'
# publica Keycloak em HTTP puro numa porta do host (KEYCLOAK_PORT). Este
# exemplo e' para ser colado no site/vhost do OUTRO servidor Ubuntu+aaPanel
# (o que faz o roteamento/proxy reverso de toda a prefeitura), no campo
# "Configuracao do site" > aba de config do Nginx (ou em
# /www/server/panel/vhost/nginx/<dominio>.conf, dependendo da versao do
# aaPanel) - NAO use o formulario simplificado de "Proxy Reverso" do
# aaPanel se ele nao expuser os campos de buffer abaixo, va' direto no
# arquivo de config do site.
#
# Troque:
#   sso.rondonopolis.mt.gov.br  -> o KC_HOSTNAME real (sem "https://")
#   10.0.0.X                    -> o IP da VM onde este docker-compose roda
#   18443                       -> o KEYCLOAK_PORT do .env dessa VM
# =============================================================================

server {
    listen 443 ssl http2;
    server_name sso.rondonopolis.mt.gov.br;

    # Certificado gerenciado pelo aaPanel (Let's Encrypt ou proprio) - fora
    # do escopo deste arquivo, o aaPanel ja preenche isso ao emitir o cert.
    # ssl_certificate     /caminho/gerado/pelo/aapanel/fullchain.pem;
    # ssl_certificate_key /caminho/gerado/pelo/aapanel/privkey.pem;

    # Precisa estar no nivel "server", nao dentro de "location" - o Nginx
    # rejeita a config inteira (nginx: [emerg] "large_client_header_buffers"
    # directive is not allowed here) se ficar dentro do location, e o site
    # nem sobe. Mesmo motivo do buffer de resposta abaixo: headers/cookies
    # do Keycloak (sessao, SAML, multiplos realms/clients) sao maiores que
    # o padrao do Nginx.
    large_client_header_buffers 4 16k;

    location / {
        # HTTP puro - o Keycloak desta stack NAO fala TLS nesta porta.
        # Usar "https://" aqui (ou apontar pra porta errada) e' causa
        # classica de 502, porque o Nginx tenta handshake TLS contra um
        # socket que so' fala HTTP puro e a conexao cai.
        proxy_pass http://10.0.0.X:18443;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Estes dois sao OBRIGATORIOS - sem eles o Keycloak (KC_PROXY_HEADERS=
        # xforwarded) nao reconhece a requisicao como HTTPS e gera link
        # http:// nos fluxos OIDC, mesmo com o restante certo.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Buffers maiores que o padrao do Nginx (4k/8k) - o Keycloak envia
        # headers/cookies maiores que o normal (sessao, SAML, multiplos
        # realms/clients). Padrao pequeno demais causa "upstream sent too
        # big header while reading response header from upstream" no log
        # de erro do Nginx, que o navegador ve como 502 Bad Gateway.
        proxy_buffer_size          16k;
        proxy_buffers              4 16k;
        proxy_busy_buffers_size    32k;

        # Timeouts generosos - primeira requisicao apos o container subir
        # (JIT/warmup da JVM) pode ser mais lenta que o padrao de 60s em
        # alguns hardwares.
        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;

        # Headers de seguranca - X-Frame-Options precisa ser SAMEORIGIN
        # (nao DENY): o Keycloak usa um iframe same-origin pro "status
        # iframe" de SSO/SLO. DENY quebra login/logout silenciosamente.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

server {
    listen 80;
    server_name sso.rondonopolis.mt.gov.br;
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# Checklist rapido se ainda der 502 depois de aplicar isto:
#
#   1. Do servidor do PROXY (este arquivo), rode:
#        curl -v http://10.0.0.X:18443/realms/master/.well-known/openid-configuration
#      Se der "Connection refused" ou timeout, o problema e' firewall na
#      VM do Keycloak (ufw + aba de Seguranca do aaPanel DAQUELA VM +
#      Security Group da nuvem, se houver) bloqueando o IP DESTE proxy -
#      nao e' este arquivo de config.
#
#   2. Se o curl acima responder 200 mas o navegador ainda ver 502,
#      confira o log de erro do Nginx deste servidor
#      (/www/wwwlogs/<dominio>.error.log no aaPanel) - a mensagem exata
#      ali (connection refused / timeout / too big header) aponta
#      exatamente qual dos itens acima e' o culpado.
#
#   3. Rode tambem ./scripts/diagnose_502.sh na VM do Keycloak - ele
#      confirma automaticamente os passos 1 acima.
# -----------------------------------------------------------------------------
