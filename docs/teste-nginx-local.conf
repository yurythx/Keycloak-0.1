# =============================================================================
# Config de TESTE LOCAL (Docker Desktop) do proxy reverso - NAO e' pra
# produção. Simula o Nginx/Tengine do aaPanel (192.168.0.218) rodando
# num container a parte, apontando pro Keycloak desta stack.
#
# Já inclui a correção encontrada durante o teste real: com
# "large_client_header_buffers" dentro de "location", o Nginx recusa
# subir ("directive is not allowed here") - tem que ficar no nível
# "server". O mesmo ajuste já foi replicado no arquivo de PRODUÇÃO em
# docs/exemplo-nginx-proxy-externo.conf.
#
# Sem TLS aqui de proposito (teste local, sem certificado) - por isso
# X-Forwarded-Proto e' fixado em "https" na mao, simulando o que o proxy
# real faria depois de terminar o TLS.
#
# Como reproduzir o teste:
#   docker run -d --name kc_proxy_test \
#     --add-host=host.docker.internal:host-gateway \
#     -p 8888:8080 \
#     -v "<caminho-absoluto-deste-arquivo>:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:alpine
#
#   curl -s -o /dev/null -w '%{http_code}\n' -H "Host: sso.rondonopolis.mt.gov.br" \
#     http://localhost:8888/realms/master/.well-known/openid-configuration
#
#   docker logs kc_proxy_test   # confirma ausencia de 502/erro de buffer
#   docker rm -f kc_proxy_test  # remove o container de teste ao terminar
# =============================================================================

server {
    listen 8080;
    server_name localhost;

    # Nivel "server", nao "location" - ver nota no topo do arquivo.
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass http://host.docker.internal:18443;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_buffer_size          16k;
        proxy_buffers               4 16k;
        proxy_busy_buffers_size    32k;

        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
    }
}
